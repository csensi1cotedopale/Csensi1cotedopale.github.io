<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nouveau mot de passe - CSEE NSI1 Côte d'Opale</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff8f3;
      color: #432019;
    }

    .box {
      max-width: 520px;
      margin: 80px auto;
      padding: 35px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,.12);
    }

    h1 {
      color: #a51d13;
      text-align: center;
    }

    p {
      text-align: center;
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 12px;
      border-radius: 9px;
      font-size: 16px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      border: 0;
      background: #a51d13;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Nouveau mot de passe</h1>

  <p>
    Choisissez votre nouveau mot de passe administrateur.
  </p>

  <input
    id="password"
    type="password"
    placeholder="Nouveau mot de passe"
  >

  <input
    id="password2"
    type="password"
    placeholder="Confirmer le nouveau mot de passe"
  >

  <button onclick="changerMotDePasse()">
    Enregistrer mon nouveau mot de passe
  </button>

  <div id="message"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://cqzkhwajtfkuxqhdhyzs.supabase.co";

const SUPABASE_KEY =
"sb_publishable_mhYOwr8dNzCdeIt4DiRzzg_C1YgC4zi";

const supabaseClient =
supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


async function changerMotDePasse() {

  const password =
    document.getElementById("password").value;

  const password2 =
    document.getElementById("password2").value;

  const message =
    document.getElementById("message");


  if (password.length < 6) {
    message.textContent =
      "Le mot de passe doit contenir au moins 6 caractères.";
    return;
  }


  if (password !== password2) {
    message.textContent =
      "Les deux mots de passe ne sont pas identiques.";
    return;
  }


  message.textContent =
    "Enregistrement en cours...";


  const { error } =
    await supabaseClient.auth.updateUser({
      password: password
    });


  if (error) {
    message.textContent =
      "Impossible de modifier le mot de passe : " +
      error.message;
    return;
  }


  message.textContent =
    "Mot de passe enregistré ! Redirection...";


  setTimeout(function() {
    window.location.href = "admin.html";
  }, 1500);

}

</script>

</body>
</html>
