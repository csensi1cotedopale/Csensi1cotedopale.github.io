<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestion des concours - CSEE NSI1 Côte d'Opale</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fff8f3;
    color: #432019;
}

header {
    background: #8f1d14;
    color: white;
    padding: 25px;
    text-align: center;
}

.container {
    max-width: 900px;
    margin: 30px auto;
    padding: 25px;
}

.retour {
    display: inline-block;
    background: #1d1d23;
    color: white;
    padding: 12px 20px;
    text-decoration: none;
    border-radius: 8px;
    margin-bottom: 25px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 25px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.10);
}

input, textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin: 8px 0 15px;
    border: 1px solid #ccc;
    border-radius: 7px;
}

textarea {
    min-height: 120px;
}

button {
    background: #a92519;
    color: white;
    border: none;
    padding: 13px 20px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>🏆 Gestion des concours</h1>
    <p>CSEE NSI1 Côte d'Opale</p>
</header>

<div class="container">

<a class="retour" href="admin.html">← Retour au tableau de bord</a>

<div class="card">
    <h2>Créer un nouveau concours</h2>

    <label>Titre du concours</label>
    <input type="text" id="titre" placeholder="Ex : Concours du plus beau sapin">

    <label>Description</label>
    <textarea id="description" placeholder="Présentez le concours..."></textarea>

    <label>Date de début</label>
    <input type="date" id="dateDebut">

    <label>Date de fin</label>
    <input type="date" id="dateFin">

    <label>Image ou affiche</label>
    <input type="file" id="image" accept="image/*">

   <button type="button" id="publierConcours">🏆 Publier le concours</button> 
</div>

<div class="card">
    <h2>Concours publiés</h2>
    <div id="listeConcours">
        Aucun concours publié pour le moment.
    </div>
</div>

</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> 
<script>
    const SUPABASE_URL = 'https://cqzkhwajtfkuxqhdhyzs.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_mhYOwr8dNzCdeIt4DiRzzg_C1YgC4zi';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    document.getElementById('publierConcours').addEventListener('click', publierConcours);
    let concoursEnModification = null;
    async function publierConcours() {
        const titre = document.getElementById('titre').value;
const description = document.getElementById('description').value;
const dateDebut = document.getElementById('dateDebut').value;
const dateFin = document.getElementById('dateFin').value;
       const imageFile = document.getElementById('image').files[0];
        let imagePath = null;

if (imageFile) {
    const fileName = Date.now() + '-' + imageFile.name;

    const { error: uploadError } = await supabaseClient.storage
        .from('concours-images')
        .upload(fileName, imageFile);

    if (uploadError) {
        alert("Erreur lors de l'envoi de l'image : " + uploadError.message);
        return;
    }

    imagePath = fileName;
}
        if (concoursEnModification) {
    const modifications = {
        titre: titre,
        description: description,
        date_debut: dateDebut,
        date_fin: dateFin
    };

    if (imagePath) {
        modifications.image_path = imagePath;
    }

    const { error } = await supabaseClient
        .from('concours')
        .update(modifications)
        .eq('id', concoursEnModification);

    if (error) {
        alert("Erreur lors de la modification : " + error.message);
    } else {
        alert("Concours modifié avec succès !");
        concoursEnModification = null;
        chargerConcours();
    }

    return;
}
       const { error } = await supabaseClient
    .from('concours')
    .insert([{
        titre: titre,
        description: description,
        date_debut: dateDebut,
        date_fin: dateFin,
image_path: imagePath
    }]);
        if (error) {
    alert('Erreur : ' + error.message);
} else {
    alert('Concours publié avec succès !');
}
}
    async function chargerConcours() {
    const { data, error } = await supabaseClient
        .from('concours')
        .select('*')
        .order('created_at', { ascending: false });

    const liste = document.getElementById('listeConcours');

    if (error) {
        liste.innerHTML = 'Erreur lors du chargement des concours.';
        return;
    }

    if (!data || data.length === 0) {
        liste.innerHTML = 'Aucun concours publié pour le moment.';
        return;
    }

    liste.innerHTML = data.map(concours => `
        <div style="padding:15px; margin:10px 0; border:1px solid #ddd; border-radius:10px;">
        ${concours.image_path ? `<img src="https://cqzkhwajtfkuxqhdhyzs.supabase.co/storage/v1/object/public/concours-images/${concours.image_path}" style="max-width:300px; width:100%; border-radius:10px;">` : ''}
            <h3>${concours.titre}</h3>
            <p>${concours.description || ''}</p>
            <p><strong>Du :</strong> ${concours.date_debut || ''} 
            <strong>au :</strong> ${concours.date_fin || ''}</p>
           <button type="button" onclick="modifierConcours('${concours.id}')">✏️ Modifier</button> 
            <button type="button" onclick="supprimerConcours('${concours.id}')">🗑️ Supprimer</button>
        </div>
    `).join('');
}
   chargerConcours(); 
    async function supprimerConcours(id) {
  if (!confirm("Voulez-vous vraiment supprimer ce concours ?")) return;

  const { error } = await supabaseClient
    .from("concours")
    .delete()
    .eq("id", id);

  if (error) {
    alert("Erreur lors de la suppression : " + error.message);
    return;
  }

  alert("Concours supprimé !");
  chargerConcours();
}
   async function modifierConcours(id) {
       concoursEnModification = id;
    const { data, error } = await supabaseClient
        .from('concours')
        .select('*')
        .eq('id', id)
        .single();

    if (error) {
        alert("Erreur : " + error.message);
        return;
    }

    document.getElementById('titre').value = data.titre || '';
    document.getElementById('description').value = data.description || '';
    document.getElementById('dateDebut').value = data.date_debut || '';
    document.getElementById('dateFin').value = data.date_fin || '';
} 
</script>    
</body>
</html>
